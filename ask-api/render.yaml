# Render 部署配置 (Blueprint)
# 文档: https://render.com/docs/blueprint-spec
# 免费套餐：0.1 CPU, 512MB RAM, 750 小时/月
#
# 注意：免费套餐不支持持久化磁盘，SQLite 会随重启丢失。
# 因此使用 Render Postgres 免费数据库（1GB 存储，90天后过期需重建）。

databases:
  - name: ask-api-db
    databaseName: askapi
    user: askapi
    ipAllowList:
      - source: 0.0.0.0/0
        description: all

services:
  - type: web
    name: ask-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: DEBUG
        value: "false"
      - key: MESSAGE_RETENTION_DAYS
        value: "7"
      - key: CLEANUP_INTERVAL_HOURS
        value: "24"
      - key: DAILY_REQUEST_LIMIT
        value: "200"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: LLM_MODEL
        value: "glm-4-flash-250414"
      - key: LLM_BASE_URL
        value: "https://open.bigmodel.cn/api/paas/v4"
      - key: LLM_API_KEY
        sync: false  # 手动在 Render 控制台填写智谱 API Key
      - key: DATABASE_URL
        fromDatabase:
          name: ask-api-db
          property: connectionString
