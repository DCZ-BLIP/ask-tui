# fly.toml — Fly.io 部署配置
# 文档: https://fly.io/docs/reference/configuration/
#
# Fly.io 免费套餐：3 个 shared-cpu-1x VM (256MB)，3GB 持久卷
# 优势：支持持久化卷，SQLite 可直接持久化，无需 Postgres

app = "ask-api"
primary_region = "nrt"  # 东京区域（离中国最近）

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true   # 空闲自动停止（节省免费额度）
  auto_start_machines = true  # 有请求自动启动
  min_machines_running = 0    # 免费套餐设为 0

# 持久化卷 — SQLite 数据库存储
[[mounts]]
  source = "ask_data"
  destination = "/data"
  auto_app = true

# 环境变量
[env]
  DEBUG = "false"
  DATABASE_URL = "sqlite+aiosqlite:////data/ask_api.db"
  MESSAGE_RETENTION_DAYS = "7"
  CLEANUP_INTERVAL_HOURS = "24"
  DAILY_REQUEST_LIMIT = "200"
  RATE_LIMIT_ENABLED = "true"
  LLM_MODEL = "glm-4-flash-250414"
  LLM_BASE_URL = "https://open.bigmodel.cn/api/paas/v4"
  # 以下密钥需通过 fly secrets 设置：
  # fly secrets set ADMIN_API_KEY=your-admin-key
  # fly secrets set LLM_API_KEY=your-zhipu-api-key

# VM 配置
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
